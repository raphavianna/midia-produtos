<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Biblioteca de mídia — produtos e campanhas</title>
<!--
  Menu de navegacao da midia.

  Le `catalogo.json` (fotos de produto) e `artes.json` (artes de campanha) em
  runtime, em vez de receber os dados embutidos pelo build. Assim uma
  atualizacao de catalogo nao exige regerar HTML: basta o JSON novo.

  Toda imagem e servida pelo CDN da Nuvemshop. Este repositorio nao guarda
  binario — o que existe aqui sao enderecos.
-->
<style>
  :root {
    --fundo: #fbfaf9; --superficie: #fff; --borda: #e5e1dc;
    --texto: #1c1a17; --suave: #6b645c; --destaque: #b8552a; --ok: #2c7a4b;
    --destaque-fraco: #f7ece6; --alerta: #8a5a10; --alerta-fraco: #faf0dd;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --fundo: #161513; --superficie: #201e1b; --borda: #35322e;
      --texto: #f0ece7; --suave: #a49b91; --destaque: #e4835a; --ok: #6bbd8b;
      --destaque-fraco: #2e211a; --alerta: #d9a441; --alerta-fraco: #2c2416;
    }
  }
  :root[data-theme="dark"] {
    --fundo: #161513; --superficie: #201e1b; --borda: #35322e;
    --texto: #f0ece7; --suave: #a49b91; --destaque: #e4835a; --ok: #6bbd8b;
    --destaque-fraco: #2e211a; --alerta: #d9a441; --alerta-fraco: #2c2416;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 28px 20px 0; max-width: 1400px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.01em; }
  .sub { color: var(--suave); font-size: 14px; margin-bottom: 16px; }
  .abas { display: flex; gap: 4px; }
  .aba { padding: 9px 16px; border: 0; background: none; cursor: pointer; font-size: 14px;
    color: var(--suave); border-bottom: 2px solid transparent; font-family: inherit; }
  .aba[aria-selected="true"] { color: var(--destaque); border-bottom-color: var(--destaque); font-weight: 600; }
  .controles { position: sticky; top: 0; z-index: 5; background: var(--fundo);
    border-bottom: 1px solid var(--borda); padding: 12px 20px; }
  .controles-int { max-width: 1400px; margin: 0 auto; display: flex; gap: 10px;
    flex-wrap: wrap; align-items: center; }
  input[type="search"], select { padding: 8px 11px; border: 1px solid var(--borda);
    border-radius: 9px; background: var(--superficie); color: var(--texto);
    font-size: 14px; font-family: inherit; }
  input[type="search"] { flex: 1; min-width: 220px; }
  .contagem { color: var(--suave); font-size: 13px; margin-left: auto; }
  main { max-width: 1400px; margin: 0 auto; padding: 20px 20px 60px; }
  .grade { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
  .cartao { border: 1px solid var(--borda); border-radius: 10px; background: var(--superficie);
    overflow: hidden; display: flex; flex-direction: column; }
  .capa { aspect-ratio: 1; background: var(--fundo); display: flex; align-items: center;
    justify-content: center; overflow: hidden; cursor: zoom-in; }
  .capa img { width: 100%; height: 100%; object-fit: contain; }
  .capa.vazia { color: var(--suave); font-size: 12px; cursor: default; }
  .corpo { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .nome { font-size: 13px; font-weight: 600; line-height: 1.35; }
  .meta { font-size: 11.5px; color: var(--suave); }
  .rotulos { display: flex; gap: 5px; flex-wrap: wrap; }
  .rotulo { font-size: 10.5px; padding: 2px 7px; border-radius: 999px;
    background: var(--destaque-fraco); color: var(--destaque); }
  .rotulo.alerta { background: var(--alerta-fraco); color: var(--alerta); }
  .acoes { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; }
  button.mini, a.mini { flex: 1; padding: 6px 8px; font-size: 11.5px; text-align: center;
    text-decoration: none; border: 1px solid var(--borda); border-radius: 7px;
    background: var(--fundo); color: var(--texto); cursor: pointer; font-family: inherit; }
  button.mini:hover, a.mini:hover { border-color: var(--destaque); color: var(--destaque); }
  button.mini.feito { color: var(--ok); border-color: var(--ok); }
  .aviso { padding: 22px; border: 1px dashed var(--borda); border-radius: 10px;
    color: var(--suave); font-size: 14px; text-align: center; }
  .aviso code { background: var(--superficie); padding: 1px 5px; border-radius: 4px; }
  dialog { border: 0; border-radius: 12px; padding: 0; background: var(--superficie);
    max-width: 92vw; color: var(--texto); }
  dialog::backdrop { background: rgba(0,0,0,.72); }
  dialog img { display: block; max-width: 88vw; max-height: 78vh; }
  .lupa-rodape { display: flex; gap: 8px; padding: 10px 12px; align-items: center; }
  .lupa-rodape .nome { flex: 1; }
</style>
</head>
<body>

<header>
  <h1>Biblioteca de mídia</h1>
  <div class="sub" id="subtitulo">carregando…</div>
  <div class="abas" role="tablist">
    <button class="aba" role="tab" id="aba-catalogo" aria-selected="true">Catálogo</button>
    <button class="aba" role="tab" id="aba-campanhas" aria-selected="false">Campanhas</button>
  </div>
</header>

<div class="controles">
  <div class="controles-int">
    <input type="search" id="busca" placeholder="Buscar por nome, SKU ou categoria…" autocomplete="off">
    <select id="filtro"><option value="">Todas as categorias</option></select>
    <span class="contagem" id="contagem"></span>
  </div>
</div>

<main><div class="grade" id="grade"></div><div id="aviso"></div></main>

<dialog id="lupa">
  <img id="lupa-img" alt="">
  <div class="lupa-rodape">
    <span class="nome" id="lupa-nome"></span>
    <button class="mini" id="lupa-copiar">Copiar link</button>
    <button class="mini" id="lupa-fechar">Fechar</button>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
let ABA = 'catalogo';
let CATALOGO = null;
let ARTES = null;

/**
 * Carrega um JSON opcional.
 *
 * Ausente nao e erro: o repositorio pode ainda nao ter rodado a publicacao de
 * artes, ou o catalogo. A pagina precisa abrir e dizer o que falta, em vez de
 * mostrar tela vazia com erro no console.
 */
async function carregar(arquivo) {
  try {
    const r = await fetch(arquivo, { cache: 'no-cache' });
    return r.ok ? await r.json() : null;
  } catch { return null; }
}

function copiar(texto, botao) {
  navigator.clipboard.writeText(texto).then(() => {
    const antes = botao.textContent;
    botao.textContent = 'copiado';
    botao.classList.add('feito');
    setTimeout(() => { botao.textContent = antes; botao.classList.remove('feito'); }, 1200);
  });
}

function ampliar(src, nome) {
  $('lupa-img').src = src;
  $('lupa-img').alt = nome;
  $('lupa-nome').textContent = nome;
  $('lupa-copiar').onclick = (e) => copiar(src, e.target);
  $('lupa').showModal();
}
$('lupa-fechar').onclick = () => $('lupa').close();
$('lupa').onclick = (e) => { if (e.target === $('lupa')) $('lupa').close(); };

function cartao({ src, titulo, meta, rotulos = [], link }) {
  const el = document.createElement('div');
  el.className = 'cartao';

  const capa = document.createElement('div');
  capa.className = src ? 'capa' : 'capa vazia';
  if (src) {
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = src;
    img.alt = titulo;
    capa.appendChild(img);
    capa.onclick = () => ampliar(src, titulo);
  } else {
    capa.textContent = 'sem imagem';
  }
  el.appendChild(capa);

  const corpo = document.createElement('div');
  corpo.className = 'corpo';

  const nome = document.createElement('div');
  nome.className = 'nome';
  nome.textContent = titulo;
  corpo.appendChild(nome);

  if (meta) {
    const m = document.createElement('div');
    m.className = 'meta';
    m.textContent = meta;
    corpo.appendChild(m);
  }

  if (rotulos.length) {
    const r = document.createElement('div');
    r.className = 'rotulos';
    for (const t of rotulos) {
      const s = document.createElement('span');
      s.className = t.alerta ? 'rotulo alerta' : 'rotulo';
      s.textContent = t.texto ?? t;
      r.appendChild(s);
    }
    corpo.appendChild(r);
  }

  const acoes = document.createElement('div');
  acoes.className = 'acoes';
  if (src) {
    const b = document.createElement('button');
    b.className = 'mini';
    b.textContent = 'Copiar link';
    b.onclick = (e) => copiar(src, e.target);
    acoes.appendChild(b);
  }
  if (link) {
    const a = document.createElement('a');
    a.className = 'mini';
    a.href = link;
    a.target = '_blank';
    a.rel = 'noopener';
    a.textContent = 'Abrir na loja';
    acoes.appendChild(a);
  }
  if (acoes.children.length) corpo.appendChild(acoes);

  el.appendChild(corpo);
  return el;
}

/** Achata o catalogo numa lista de cartoes, um por foto. */
function itensCatalogo() {
  if (!CATALOGO) return [];
  const itens = [];
  for (const p of CATALOGO.produtos) {
    const categorias = p.categorias.join(' › ');
    const busca = `${p.nome} ${p.sku ?? ''} ${categorias}`.toLowerCase();

    // Produto sem foto continua na lista, marcado. Some-lo esconderia
    // exatamente o caso que alguem precisa resolver.
    if (p.imagens.length === 0) {
      itens.push({
        src: null, titulo: p.nome, meta: categorias || '—', busca,
        categorias: p.categorias, link: p.url,
        rotulos: [{ texto: 'sem foto', alerta: true }],
      });
      continue;
    }

    p.imagens.forEach((img, i) => {
      itens.push({
        src: img.src,
        titulo: p.nome,
        meta: [p.sku, categorias].filter(Boolean).join(' · ') || '—',
        busca,
        categorias: p.categorias,
        link: p.url,
        rotulos: [
          `foto ${i + 1}/${p.imagens.length}`,
          ...(p.publicado ? [] : [{ texto: 'despublicado', alerta: true }]),
        ],
      });
    });
  }
  return itens;
}

function itensCampanhas() {
  if (!ARTES) return [];
  return ARTES.artes.map((a) => ({
    src: a.src,
    titulo: a.nome,
    meta: a.publicado_em ? `publicada em ${a.publicado_em.slice(0, 10)}` : '',
    busca: a.nome.toLowerCase(),
    categorias: [],
    rotulos: [],
  }));
}

function desenhar() {
  const termo = $('busca').value.trim().toLowerCase();
  const cat = $('filtro').value;
  const todos = ABA === 'catalogo' ? itensCatalogo() : itensCampanhas();

  const itens = todos.filter((i) =>
    (!termo || i.busca.includes(termo)) && (!cat || i.categorias.includes(cat)));

  $('grade').replaceChildren(...itens.map(cartao));

  const aviso = $('aviso');
  aviso.replaceChildren();
  if (itens.length === 0) {
    const d = document.createElement('div');
    d.className = 'aviso';
    if (ABA === 'catalogo' && !CATALOGO) {
      d.innerHTML = 'Nenhum <code>catalogo.json</code> aqui ainda. Rode <code>npm run midia:catalogo</code> no projeto de integração.';
    } else if (ABA === 'campanhas' && !ARTES) {
      d.innerHTML = 'Nenhum <code>artes.json</code> aqui ainda. Rode <code>npm run midia:publicar</code> no projeto de integração.';
    } else {
      d.textContent = 'Nada encontrado com esse filtro.';
    }
    aviso.appendChild(d);
  }

  $('contagem').textContent = `${itens.length} de ${todos.length}`;
  $('filtro').style.display = ABA === 'catalogo' ? '' : 'none';
}

function trocarAba(qual) {
  ABA = qual;
  $('aba-catalogo').setAttribute('aria-selected', String(qual === 'catalogo'));
  $('aba-campanhas').setAttribute('aria-selected', String(qual === 'campanhas'));
  desenhar();
}
$('aba-catalogo').onclick = () => trocarAba('catalogo');
$('aba-campanhas').onclick = () => trocarAba('campanhas');
$('busca').oninput = desenhar;
$('filtro').onchange = desenhar;

(async function iniciar() {
  [CATALOGO, ARTES] = await Promise.all([carregar('catalogo.json'), carregar('artes.json')]);

  const partes = [];
  if (CATALOGO) {
    if (CATALOGO.loja?.nome) partes.push(CATALOGO.loja.nome);
    partes.push(`${CATALOGO.totais.produtos} produtos · ${CATALOGO.totais.imagens} fotos`);
    // As categorias saem da arvore, nao dos rotulos dos produtos: assim uma
    // categoria vazia ainda aparece no filtro em vez de sumir sem aviso.
    for (const n of [...new Set(CATALOGO.categorias.map((c) => c.nome))].sort()) {
      const o = document.createElement('option');
      o.value = n;
      o.textContent = n;
      $('filtro').appendChild(o);
    }
  }
  if (ARTES) partes.push(`${ARTES.total} artes`);
  partes.push('imagens servidas pela Nuvemshop');
  $('subtitulo').textContent = partes.join(' — ');

  desenhar();
})();
</script>
</body>
</html>
