name: Gerar recortes, índice e galeria

# Dispara quando uma imagem nova entra em originais/ (inclusive pelo botao
# "Add file -> Upload files" da interface web do GitHub) ou quando a config muda.
# Nao dispara com as mudancas que o proprio robo faz em cdn/, indice.csv e
# index.html, entao nao ha risco de loop.
on:
  push:
    branches: [main]
    paths:
      - 'originais/**'
      - 'midia.config.json'
      - 'bin/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-midia
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Publicar o que mudou
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Regenera indice"
            git push
          fi

      # Os recortes ficam so no runner: `cdn/` esta no .gitignore porque as
      # imagens passaram a ser servidas pela Nuvemshop, nao por jsDelivr.
      # Quem leva o arquivo ate a loja e `midia:publicar`, que roda na maquina
      # de quem publica — o token da loja nao vive neste repositorio.
      #
      # Sem este aviso o job terminaria verde com a arte parada em
      # originais/campanhas/, sem nada publicado e sem ninguem saber.
      - name: Avisar que falta publicar
        run: |
          novas=$(find cdn/campanhas -type f 2>/dev/null | wc -l)
          if [ "$novas" -gt 0 ]; then
            {
              echo "### $novas recorte(s) de campanha gerados — ainda NAO publicados"
              echo ""
              echo "Eles existem so neste runner. Para levar ate a loja, rode na sua maquina:"
              echo ""
              echo '```'
              echo "npm run build                 # regera os recortes localmente"
              echo "npm run midia:publicar -- --artes cdn/campanhas   # ensaio"
              echo "npm run midia:publicar -- --artes cdn/campanhas --confirmar"
              echo '```'
              echo ""
              echo "Os dois ultimos comandos rodam no projeto integracao-nuvemshop."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
